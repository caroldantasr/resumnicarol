  err.style.display = 'none'; sp.style.display = 'block'; btn.disabled = true;
  try {
    const parts = encryptedPayload.split(':');
    const salt = new Uint8Array(parts[0].match(/.{1,2}/g).map(b => parseInt(b,16)));
    const iv = new Uint8Array(parts[1].match(/.{1,2}/g).map(b => parseInt(b,16)));
    const authTag = new Uint8Array(parts[2].match(/.{1,2}/g).map(b => parseInt(b,16)));
    const encrypted = new Uint8Array(parts[3].match(/.{1,2}/g).map(b => parseInt(b,16)));
    const passwordBytes = new TextEncoder().encode(password);
    const baseKey = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveBits']);
    const derivedBits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:600000, hash:'SHA-256'}, baseKey, 256);
    const aesKey = await crypto.subtle.importKey('raw', new Uint8Array(derivedBits), 'AES-GCM', false, ['decrypt']);
    const combined = new Uint8Array([...encrypted, ...authTag]);
    const decryptedBuffer = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv, tagLength:128}, aesKey, combined);
    const html = new TextDecoder().decode(decryptedBuffer);
    document.open(); document.write(html); document.close();
  } catch (ex) {
    sp.style.display = 'none'; btn.disabled = false; err.style.display = 'block';
  }
});
</script>
</body>
